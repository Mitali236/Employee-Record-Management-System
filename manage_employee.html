{% extends "base.html" %}
{% block content %}
<h1>{% if employee %}Edit{% else %}Add{% endif %} Employee</h1>
<form method="post">
    {% csrf_token %}
    <label>Name:</label>
    <input type="text" name="name" value="{{ employee.username|default:'' }}" required><br>
    <label>Email:</label>
    <input type="email" name="email" value="{{ employee.email|default:'' }}" required><br>
    <label>Role:</label>
    <select name="role">
        <option value="Employee" {% if employee.role == 'Employee' %}selected{% endif %}>Employee</option>
        <option value="HR" {% if employee.role == 'HR' %}selected{% endif %}>HR</option>
    </select><br>
    <button type="submit">Save</button>
</form>
{% endblock %}
