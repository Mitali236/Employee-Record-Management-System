<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Portal</title>
    <style>
        .image-container {
            width: 80%; /* Adjust the width as needed */
            margin: 0 auto; /* Center the container */
        }
        .image-container img {
            width: 100%; /* Make the image responsive */
            height: auto; /* Maintain aspect ratio */
        }
    </style>
</head>
<body>
    <div class="background-image">
        <div class="panel">
            <img src="{% static 'images/th.jpg' %}" alt="Workplace" width="100%" height="500">
            <h1>HR Portal</h1>
            <h2>Sign In</h2>
            <form action="/login" method="POST">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember Me</label>
                </div>
                <button type="submit">Sign In</button>
                <p>Forgot your password?</p>
                <p>If you have not created an account yet, please sign up first.</p>
                <a href="/signup">Sign Up</a>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.querySelector("form");
            
            form.addEventListener("submit", function(event) {
                let valid = true;
                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;
                const emailError = document.createElement("div");
                const passwordError = document.createElement("div");
    
                // Clear previous error messages
                document.querySelectorAll(".error").forEach(el => el.remove());
    
                // Email validation
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    valid = false;
                    emailError.textContent = "Please enter a valid email address.";
                    emailError.classList.add("error");
                    form.insertBefore(emailError, form.firstChild);
                }
    
                // Password validation
                if (password.length < 6) {
                    valid = false;
                    passwordError.textContent = "Password must be at least 6 characters long.";
                    passwordError.classList.add("error");
                    form.insertBefore(passwordError, form.firstChild);
                }
    
                // Prevent form submission if validation fails
                if (!valid) {
                    event.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
